<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주인님의 테트리스</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap');

        :root {
            --bg: #0f0f17;
            --panel: #1a1a2e;
            --border: #2a2a4a;
            --accent: #4da6ff;
            --accent2: #ff4d8d;
            --green: #00ff88;
            --text: #e0e0ff;
            --subtext: #7070a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* 더블탭 확대 방지 */
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ===== 메뉴 ===== */
        #menu-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .menu-box {
            background: var(--panel);
            padding: 28px 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        .menu-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 6px;
            text-shadow: 0 0 20px rgba(77,166,255,0.5);
        }

        .menu-sub {
            font-size: 11px;
            color: var(--subtext);
            margin-bottom: 24px;
        }

        .main-btn {
            display: block;
            padding: 18px;
            font-size: 18px;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            color: white;
            margin: 10px 0;
            width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .main-btn:active { opacity: 0.75; }
        .btn-single { background: linear-gradient(135deg, #ff8c00, #ffd700); color: #1a1a00; }
        .btn-create { background: linear-gradient(135deg, var(--accent), #7b5ea7); }
        .btn-gray   { background: #2a2a3a; font-size: 14px; padding: 12px; color: #aaa; }

        .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

        .join-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .room-input {
            flex: 1;
            min-width: 0;
            padding: 12px 8px;
            font-size: 20px;
            font-family: 'Press Start 2P', monospace;
            text-transform: uppercase;
            text-align: center;
            border-radius: 8px;
            border: 2px solid var(--border);
            outline: none;
            background: #0f0f1f;
            color: var(--accent);
            letter-spacing: 4px;
            -webkit-appearance: none;
            touch-action: manipulation;
        }
        .room-input:focus { border-color: var(--accent); }

        .join-btn {
            flex-shrink: 0;
            padding: 16px 18px;
            background: var(--accent2);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .join-btn:active { opacity: 0.75; }

        #waiting-room { display: none; }

        .room-code-display {
            font-family: 'Press Start 2P', monospace;
            font-size: 26px;
            color: var(--green);
            letter-spacing: 8px;
            margin: 12px 0;
            text-shadow: 0 0 20px rgba(0,255,136,0.5);
        }

        .waiting-hint {
            font-size: 12px;
            color: var(--subtext);
            margin-bottom: 16px;
            line-height: 1.7;
        }

        .copy-btn {
            display: block;
            padding: 12px;
            background: #1e3a2a;
            border: 1px solid var(--green);
            border-radius: 10px;
            color: var(--green);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 8px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .copy-btn:active { opacity: 0.75; }

        .loader {
            margin: 14px auto;
            width: 26px; height: 26px;
            border: 3px solid var(--border);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 게임 화면 ===== */
        .game-wrapper {
            display: none;
            flex-direction: row;
            gap: 8px;
            align-items: flex-start;
            justify-content: center;
            width: 100vw;
            padding: 4px;
            flex-shrink: 0;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .box-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            margin-bottom: 6px;
            color: var(--subtext);
            letter-spacing: 1px;
        }

        .stats-value {
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--accent);
        }

        #board {
            display: block;
            border: 1px solid var(--border);
            border-radius: 4px;
            touch-action: none;
        }

        #opponent-panel { display: none; }
        #opponent-board {
            display: block;
            border: 1px solid #552233;
            border-radius: 4px;
        }

        .game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,20,0.95);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            display: none;
            border: 1px solid var(--border);
            z-index: 100;
            white-space: nowrap;
        }

        .game-result-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            margin-bottom: 16px;
            line-height: 1.8;
        }

        /* ===== 모바일 컨트롤 ===== */
        .mobile-controls {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 16px;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .d-pad { position: relative; width: 156px; height: 156px; }
        .d-btn {
            position: absolute;
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.06);
            border: 1px solid #333355;
            border-radius: 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 18px; color: #8888aa;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .d-btn:active { background: rgba(77,166,255,0.25); border-color: var(--accent); color: var(--accent); }
        .d-up    { top: 0;     left: 53px; }
        .d-left  { top: 53px; left: 0;    }
        .d-down  { top: 106px; left: 53px; }
        .d-right { top: 53px; left: 106px; }

        .action-pad { display: flex; justify-content: center; align-items: center; width: 156px; height: 156px; }
        .btn-drop {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(255,77,141,0.1);
            border: 2px solid var(--accent2);
            color: var(--accent2);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            display: flex; justify-content: center; align-items: center;
            text-align: center;
            line-height: 1.5;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-drop:active { background: rgba(255,77,141,0.3); }

        /* ===== 치트 존 ===== */
        .cheat-zone {
            position: fixed;
            top: 0;
            width: 80px; height: 80px;
            z-index: 9999;
            opacity: 0;
            touch-action: none;
        }
        #cheat-left  { left: 0; }
        #cheat-right { right: 0; display: none; }

        .cheat-indicator {
            position: fixed;
            top: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #cheat-left-indicator  { left: 10px;  background: rgba(0,255,136,0.15);  color: var(--green);   border: 1px solid var(--green); }
        #cheat-right-indicator { right: 10px; background: rgba(255,77,141,0.15); color: var(--accent2); border: 1px solid var(--accent2); }
        .cheat-indicator.active { opacity: 1; }

        .flash-overlay {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 998;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .flash-overlay.show { opacity: 1; }

        #reverse-notice {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            color: var(--accent2);
            background: rgba(255,77,141,0.15);
            border: 1px solid var(--accent2);
            padding: 8px 14px;
            border-radius: 8px;
            z-index: 500;
            display: none;
            animation: blink 1s infinite;
            pointer-events: none;
            white-space: nowrap;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel);
            border: 1px solid var(--green);
            color: var(--green);
            font-size: 13px;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }

        #status-bar {
            position: fixed;
            bottom: 8px;
            font-size: 10px;
            color: var(--subtext);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="status-bar">환영합니다!</div>
<div id="toast"></div>

<div class="flash-overlay" id="flash-blue"  style="background:rgba(0,200,255,0.15);"></div>
<div class="flash-overlay" id="flash-red"   style="background:rgba(255,60,60,0.15);"></div>
<div class="flash-overlay" id="flash-green" style="background:rgba(0,255,100,0.15);"></div>

<div class="cheat-indicator" id="cheat-left-indicator">I-BLOCK ON</div>
<div class="cheat-indicator" id="cheat-right-indicator">REVERSE ON</div>
<div id="reverse-notice">&#9888; 조작 반전 중!</div>

<div id="cheat-left"  class="cheat-zone"></div>
<div id="cheat-right" class="cheat-zone"></div>

<!-- 메뉴 -->
<div id="menu-screen">
    <div class="menu-box">
        <div class="menu-title">TETRIS</div>
        <div class="menu-sub">주인님의 테트리스 v2.0</div>

        <div id="main-buttons">
            <button class="main-btn btn-single" onclick="startSinglePlayer()">&#128100; 혼자 하기</button>
            <button class="main-btn btn-create" onclick="createMultiRoom()">&#9876; 방 만들기</button>
            <hr class="divider">
            <div class="join-row">
                <input type="text" id="room-code-input" class="room-input" maxlength="4" placeholder="CODE">
                <button class="join-btn" onclick="joinMultiRoom()">입장</button>
            </div>
        </div>

        <div id="waiting-room">
            <p style="font-size:12px;color:var(--subtext);margin-bottom:4px;">방 코드</p>
            <div class="room-code-display" id="display-room-code">----</div>
            <p class="waiting-hint">친구에게 링크를 공유하거나<br>코드를 알려주세요!</p>
            <button class="copy-btn" onclick="copyRoomLink()">&#128279; 링크 복사하기</button>
            <div class="loader"></div>
            <p style="font-size:11px;color:var(--subtext);">상대방 연결 대기 중...</p>
            <button class="main-btn btn-gray" onclick="goMainMenu()" style="margin-top:14px;">취소</button>
        </div>
    </div>
</div>

<!-- 게임 -->
<div class="game-wrapper" id="game-wrapper">
    <div class="side-panel" id="opponent-panel">
        <div class="box">
            <div class="box-title" style="color:#ff6666;">ENEMY</div>
            <canvas id="opponent-board"></canvas>
        </div>
    </div>

    <div style="position:relative;flex-shrink:0;">
        <canvas id="board"></canvas>
        <div id="gameOverScreen" class="game-over">
            <div class="game-result-text" id="game-result-text">GAME OVER</div>
            <button class="main-btn btn-gray" onclick="goMainMenu()" style="width:auto;padding:10px 20px;font-size:12px;">메인 메뉴</button>
        </div>
    </div>

    <div class="side-panel" id="my-panel">
        <div class="box">
            <div class="box-title">NEXT</div>
            <canvas id="next"></canvas>
        </div>
        <div class="box">
            <div class="box-title">SCORE</div>
            <div id="score" class="stats-value">0</div>
        </div>
        <div class="box">
            <div class="box-title">LINES</div>
            <div id="lines" class="stats-value">0</div>
        </div>
    </div>
</div>

<!-- 모바일 컨트롤 -->
<div class="mobile-controls" id="mobile-controls">
    <div class="d-pad">
        <div class="d-btn d-up"    id="btn-up">&#9650;</div>
        <div class="d-btn d-left"  id="btn-left">&#9664;</div>
        <div class="d-btn d-down"  id="btn-down">&#9660;</div>
        <div class="d-btn d-right" id="btn-right">&#9654;</div>
    </div>
    <div class="action-pad">
        <div class="btn-drop" id="btn-hardDrop">HARD<br>DROP</div>
    </div>
</div>

<script>
// ============================================================
// 더블탭 확대 완전 차단
// ============================================================
var lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
    var now = Date.now();
    if (now - lastTouchEnd < 300) {
        e.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// ============================================================
// 상수
// ============================================================
var COLS = 10, ROWS = 20;

var COLORS = [
    null,
    '#00FFFF','#3355FF','#FF8800','#FFFF00',
    '#00FF44','#CC44FF','#FF3333','#555566'
];

var SHAPES = [
    [],
    [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]],
    [[2,0,0],[2,2,2],[0,0,0]],
    [[0,0,3],[3,3,3],[0,0,0]],
    [[4,4],[4,4]],
    [[0,5,5],[5,5,0],[0,0,0]],
    [[0,6,0],[6,6,6],[0,0,0]],
    [[7,7,0],[0,7,7],[0,0,0]]
];

// ============================================================
// 캔버스
// ============================================================
var boardCanvas = document.getElementById('board');
var ctx         = boardCanvas.getContext('2d');
var nextCanvas  = document.getElementById('next');
var ctxNext     = nextCanvas.getContext('2d');
var oppCanvas   = document.getElementById('opponent-board');
var ctxOpp      = oppCanvas.getContext('2d');

var BLOCK = 28;

function calcBlock(isMulti) {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var ctrlH  = 175;
    var padV   = 12;
    var padH   = 8;
    var availH = vh - ctrlH - padV * 2;
    var panelCount = isMulti ? 3 : 2;
    var panelW = 58;
    var gaps   = padH * (panelCount + 1);
    var boardMaxW = vw - panelW * panelCount - gaps;
    var b = Math.floor(Math.min(availH / ROWS, boardMaxW / COLS));
    return Math.max(b, 16);
}

function initCanvases(isMulti) {
    BLOCK = calcBlock(isMulti);
    boardCanvas.width  = BLOCK * COLS;
    boardCanvas.height = BLOCK * ROWS;
    var ns = Math.max(Math.floor(BLOCK * 0.55) * 4, 48);
    nextCanvas.width  = ns;
    nextCanvas.height = ns;
    if (isMulti) {
        var ob = Math.max(Math.floor(BLOCK * 0.4), 5);
        oppCanvas.width  = ob * COLS;
        oppCanvas.height = ob * ROWS;
    }
}

// ============================================================
// 게임 상태
// ============================================================
var board         = createMatrix(COLS, ROWS);
var opponentBoard = createMatrix(COLS, ROWS);
var player        = { pos:{x:0,y:0}, matrix:null };
var nextPiece     = null;

var score = 0, linesCleared = 0;
var dropCounter = 0, dropInterval = 1000, lastTime = 0;
var isGameOver = true, isMultiplayer = false, animationId;
var syncIntervalId = null;
var pendingGarbage = 0;

var isIBlockCheat      = false;
var isOpponentReversed = false;
var isControlReversed  = false;

function createMatrix(w, h) {
    var m = [];
    for (var i = 0; i < h; i++) m.push(new Array(w).fill(0));
    return m;
}

// ============================================================
// P2P
// ============================================================
var peer = null, conn = null, currentRoomCode = '';

function getRoomCodeFromURL() {
    try {
        var p = new URLSearchParams(window.location.search);
        var c = p.get('room');
        return c ? c.toUpperCase() : null;
    } catch(e) { return null; }
}

function generateRoomCode() {
    var ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    var code = '';
    for (var i = 0; i < 4; i++) code += ch[Math.floor(Math.random() * ch.length)];
    return code;
}

function getRoomPeerId(code) { return 'marineno5-tetris-v2-' + code; }

function showToast(msg, color) {
    var t = document.getElementById('toast');
    t.innerText = msg;
    t.style.borderColor = color || 'var(--green)';
    t.style.color = color || 'var(--green)';
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function copyRoomLink() {
    var url = 'https://marineno5.github.io/tetris/?room=' + currentRoomCode;
    var doFallback = function() {
        var el = document.createElement('textarea');
        el.value = url;
        el.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(el);
        el.focus(); el.select();
        try { document.execCommand('copy'); showToast('링크 복사됨!'); }
        catch(e) { showToast('복사 실패', 'var(--accent2)'); }
        document.body.removeChild(el);
    };
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function() { showToast('링크 복사됨!'); }).catch(doFallback);
    } else { doFallback(); }
}

function startSinglePlayer() {
    isMultiplayer = false;
    document.getElementById('opponent-panel').style.display = 'none';
    document.getElementById('cheat-right').style.display = 'none';
    startGameUI();
}

function createMultiRoom() {
    currentRoomCode = generateRoomCode();
    document.getElementById('status-bar').innerText = '서버 연결 중...';
    if (peer) { try { peer.destroy(); } catch(e){} }
    peer = new Peer(getRoomPeerId(currentRoomCode));

    peer.on('open', function() {
        document.getElementById('main-buttons').style.display = 'none';
        document.getElementById('waiting-room').style.display = 'block';
        document.getElementById('display-room-code').innerText = currentRoomCode;
        document.getElementById('status-bar').innerText = '상대를 기다립니다...';
    });

    peer.on('connection', function(c) { conn = c; setupConnection(c); });

    peer.on('error', function(err) {
        if (err.type === 'unavailable-id') {
            goMainMenu(); setTimeout(createMultiRoom, 200);
        } else {
            showToast('연결 오류: ' + err.type, 'var(--accent2)');
            goMainMenu();
        }
    });
}

function joinMultiRoom() {
    var code = document.getElementById('room-code-input').value.trim().toUpperCase();
    if (code.length !== 4) { showToast('4자리 코드를 입력하세요', 'var(--accent2)'); return; }

    document.getElementById('status-bar').innerText = '연결 중...';
    if (peer) { try { peer.destroy(); } catch(e){} }
    peer = new Peer();

    peer.on('open', function() {
        conn = peer.connect(getRoomPeerId(code), { reliable: true });
        var opened = false;

        conn.on('open', function() {
            opened = true;
            currentRoomCode = code;
            setupConnection(conn);
        });

        conn.on('error', function() {
            if (!opened) { showToast('연결 실패! 코드를 확인하세요', 'var(--accent2)'); goMainMenu(); }
        });

        setTimeout(function() {
            if (!opened && !isMultiplayer) {
                showToast('연결 실패! 코드를 확인하세요', 'var(--accent2)');
                goMainMenu();
            }
        }, 6000);
    });

    peer.on('error', function() { showToast('방을 찾을 수 없습니다', 'var(--accent2)'); goMainMenu(); });
}

function setupConnection(connection) {
    isMultiplayer = true;

    connection.on('data', function(data) {
        if      (data.type === 'board')      { opponentBoard = data.board; }
        else if (data.type === 'garbage')    { pendingGarbage += data.amount; }
        else if (data.type === 'gameover')   { triggerGameOver('승리!'); }
        else if (data.type === 'reverse_on') {
            isControlReversed = true;
            document.getElementById('reverse-notice').style.display = 'block';
            flash('red');
        } else if (data.type === 'reverse_off') {
            isControlReversed = false;
            document.getElementById('reverse-notice').style.display = 'none';
        }
    });

    connection.on('close', function() {
        if (!isGameOver) {
            showToast('상대방이 나갔습니다', 'var(--accent2)');
            setTimeout(goMainMenu, 1500);
        }
    });

    document.getElementById('opponent-panel').style.display = 'flex';
    document.getElementById('cheat-right').style.display = 'block';
    startGameUI();
}

function goMainMenu() {
    isGameOver = true;
    isIBlockCheat = false; isControlReversed = false; isOpponentReversed = false;
    cancelAnimationFrame(animationId);
    clearInterval(syncIntervalId);
    if (conn) { try { conn.close(); } catch(e){} conn = null; }
    if (peer) { try { peer.destroy(); } catch(e){} peer = null; }

    document.getElementById('reverse-notice').style.display = 'none';
    document.getElementById('cheat-left-indicator').classList.remove('active');
    document.getElementById('cheat-right-indicator').classList.remove('active');
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('main-buttons').style.display = 'block';
    document.getElementById('waiting-room').style.display = 'none';
    document.getElementById('game-wrapper').style.display = 'none';
    document.getElementById('mobile-controls').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('status-bar').innerText = '환영합니다!';
}

// ============================================================
// 렌더링
// ============================================================
function drawBlock(context, px, py, colorIdx, bp, alpha) {
    if (!colorIdx) return;
    context.globalAlpha = alpha;
    context.fillStyle = COLORS[colorIdx];
    context.fillRect(px, py, bp, bp);
    context.globalAlpha = alpha * 0.3;
    context.fillStyle = '#ffffff';
    context.fillRect(px, py, bp, bp * 0.14);
    context.fillRect(px, py, bp * 0.14, bp);
    context.globalAlpha = alpha * 0.2;
    context.fillStyle = '#000000';
    context.fillRect(px, py + bp * 0.86, bp, bp * 0.14);
    context.fillRect(px + bp * 0.86, py, bp * 0.14, bp);
    context.globalAlpha = 1;
}

function drawMatrix(matrix, ox, oy, context, bp, alpha) {
    for (var y = 0; y < matrix.length; y++) {
        for (var x = 0; x < matrix[y].length; x++) {
            if (matrix[y][x]) drawBlock(context, (ox+x)*bp, (oy+y)*bp, matrix[y][x], bp, alpha||1);
        }
    }
}

function draw() {
    var bp = BLOCK;
    var bw = boardCanvas.width, bh = boardCanvas.height;

    ctx.fillStyle = '#080810';
    ctx.fillRect(0, 0, bw, bh);

    ctx.strokeStyle = 'rgba(80,80,160,0.07)';
    ctx.lineWidth = 0.5;
    for (var x = 0; x <= COLS; x++) { ctx.beginPath(); ctx.moveTo(x*bp,0); ctx.lineTo(x*bp,bh); ctx.stroke(); }
    for (var y = 0; y <= ROWS; y++) { ctx.beginPath(); ctx.moveTo(0,y*bp); ctx.lineTo(bw,y*bp); ctx.stroke(); }

    drawMatrix(board, 0, 0, ctx, bp, 1);

    if (player.matrix && !isGameOver) {
        var gy = player.pos.y;
        while (!collide(board, {matrix:player.matrix, pos:{x:player.pos.x, y:gy+1}})) gy++;
        drawMatrix(player.matrix, player.pos.x, gy, ctx, bp, 0.15);
        drawMatrix(player.matrix, player.pos.x, player.pos.y, ctx, bp, 1);
    }

    if (isMultiplayer) {
        var ob = oppCanvas.width / COLS;
        ctxOpp.fillStyle = '#100008';
        ctxOpp.fillRect(0, 0, oppCanvas.width, oppCanvas.height);
        drawMatrix(opponentBoard, 0, 0, ctxOpp, ob, 1);
    }

    drawNextPiece();
}

function drawNextPiece() {
    var nw = nextCanvas.width, nh = nextCanvas.height;
    ctxNext.fillStyle = '#1a1a2e';
    ctxNext.fillRect(0, 0, nw, nh);
    if (!nextPiece) return;
    var nb = Math.floor(Math.min(nw,nh) / 4);
    var pw = nextPiece.matrix[0].length, ph = nextPiece.matrix.length;
    var ox = Math.floor((nw/nb - pw)/2);
    var oy = Math.floor((nh/nb - ph)/2);
    drawMatrix(nextPiece.matrix, ox, oy, ctxNext, nb, 1);
}

// ============================================================
// 게임 로직
// ============================================================
function randomPiece() {
    var id = isIBlockCheat ? 1 : (Math.floor(Math.random()*7)+1);
    return { matrix: SHAPES[id].map(function(r){return r.slice();}), typeId: id };
}

function collide(board, player) {
    var m = player.matrix, o = player.pos;
    for (var y = 0; y < m.length; y++)
        for (var x = 0; x < m[y].length; x++)
            if (m[y][x] && (board[y+o.y] && board[y+o.y][x+o.x]) !== 0) return true;
    return false;
}

function merge(board, player) {
    for (var y = 0; y < player.matrix.length; y++)
        for (var x = 0; x < player.matrix[y].length; x++)
            if (player.matrix[y][x]) board[y+player.pos.y][x+player.pos.x] = player.matrix[y][x];
}

function arenaSweep() {
    var n = 0;
    for (var y = board.length-1; y > 0; y--) {
        if (board[y].every(function(v){return v!==0;})) {
            board.splice(y,1); board.unshift(new Array(COLS).fill(0)); y++; n++;
        }
    }
    if (n > 0) {
        score += [0,100,300,500,800][n] || n*100;
        linesCleared += n;
        dropInterval = Math.max(100, 1000 - Math.floor(linesCleared/10)*80);
        updateScore();
        if (isMultiplayer && n >= 2) sendData({type:'garbage', amount:n-1});
    }
    if (pendingGarbage > 0) applyGarbage();
}

function applyGarbage() {
    while (pendingGarbage > 0) {
        board.shift();
        var row = new Array(COLS).fill(8);
        row[Math.floor(Math.random()*COLS)] = 0;
        board.push(row);
        pendingGarbage--;
    }
}

function sendData(obj) { if (conn && conn.open) conn.send(obj); }
function syncBoard()   { sendData({type:'board', board:board}); }

function playerDrop() {
    player.pos.y++;
    if (collide(board, player)) {
        player.pos.y--;
        merge(board, player); playerReset(); arenaSweep();
        if (isMultiplayer) syncBoard();
    }
    dropCounter = 0;
}

function playerHardDrop() {
    while (!collide(board, player)) player.pos.y++;
    player.pos.y--;
    merge(board, player); playerReset(); arenaSweep();
    dropCounter = 0;
    if (isMultiplayer) syncBoard();
}

function playerMove(dir) {
    var d = isControlReversed ? -dir : dir;
    player.pos.x += d;
    if (collide(board, player)) player.pos.x -= d;
}

function playerRotate() {
    var saved = player.matrix.map(function(r){return r.slice();});
    var sx = player.pos.x;
    rotate(player.matrix);
    var off = 1;
    while (collide(board, player)) {
        player.pos.x += off;
        off = -(off + (off>0?1:-1));
        if (Math.abs(off) > player.matrix[0].length) { player.matrix=saved; player.pos.x=sx; return; }
    }
}

function rotate(m) {
    for (var y = 0; y < m.length; y++)
        for (var x = 0; x < y; x++) {
            var t = m[x][y]; m[x][y] = m[y][x]; m[y][x] = t;
        }
    m.forEach(function(r){r.reverse();});
}

function playerReset() {
    if (!nextPiece) nextPiece = randomPiece();
    player.matrix = nextPiece.matrix;
    player.pos.y  = 0;
    player.pos.x  = Math.floor(COLS/2) - Math.floor(player.matrix[0].length/2);
    nextPiece = randomPiece();
    if (collide(board, player)) {
        triggerGameOver(isMultiplayer ? '패배...' : 'GAME OVER');
        if (isMultiplayer) sendData({type:'gameover'});
    }
}

function updateScore() {
    document.getElementById('score').innerText = score;
    document.getElementById('lines').innerText = linesCleared;
}

function triggerGameOver(msg) {
    isGameOver = true;
    cancelAnimationFrame(animationId);
    clearInterval(syncIntervalId);
    var t = document.getElementById('game-result-text');
    t.innerText = msg;
    t.style.color = msg.includes('승리') ? 'var(--accent)' : 'var(--accent2)';
    document.getElementById('gameOverScreen').style.display = 'block';
}

function update(time) {
    if (!time) time = 0;
    if (isGameOver) return;
    var dt = time - lastTime; lastTime = time;
    dropCounter += dt;
    if (dropCounter > dropInterval) playerDrop();
    draw();
    animationId = requestAnimationFrame(update);
}

function handleAction(action) {
    if (isGameOver) return;
    if      (action === 'left')     playerMove(-1);
    else if (action === 'right')    playerMove(1);
    else if (action === 'down')     playerDrop();
    else if (action === 'rotate')   playerRotate();
    else if (action === 'hardDrop') playerHardDrop();
}

function flash(color, dur) {
    var el = document.getElementById('flash-'+color);
    if (!el) return;
    el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');}, dur||200);
}

// ============================================================
// 치트
// ============================================================
var leftTapCount=0, leftTapTimer=null;

function toggleIBlockCheat() {
    if (isGameOver) return;
    isIBlockCheat = !isIBlockCheat;
    var ind = document.getElementById('cheat-left-indicator');
    ind.innerText = isIBlockCheat ? 'I-BLOCK ON' : 'I-BLOCK OFF';
    ind.classList.toggle('active', isIBlockCheat);
    flash('blue');
    if (isIBlockCheat) { nextPiece = randomPiece(); drawNextPiece(); }
}

var handleLeftCheat = function(e) {
    e.preventDefault(); e.stopPropagation();
    leftTapCount++;
    clearTimeout(leftTapTimer);
    if (leftTapCount >= 3) { toggleIBlockCheat(); leftTapCount = 0; }
    else leftTapTimer = setTimeout(function(){ leftTapCount=0; }, 800);
};
document.getElementById('cheat-left').addEventListener('touchstart', handleLeftCheat, {passive:false});
document.getElementById('cheat-left').addEventListener('mousedown',  handleLeftCheat);

var rightTapCount=0, rightTapTimer=null;

function toggleReverseCheat() {
    if (isGameOver || !isMultiplayer) return;
    isOpponentReversed = !isOpponentReversed;
    var ind = document.getElementById('cheat-right-indicator');
    ind.innerText = isOpponentReversed ? 'REVERSE ON' : 'REVERSE OFF';
    ind.classList.toggle('active', isOpponentReversed);
    sendData({type: isOpponentReversed ? 'reverse_on' : 'reverse_off'});
    flash('green');
}

var handleRightCheat = function(e) {
    e.preventDefault(); e.stopPropagation();
    rightTapCount++;
    clearTimeout(rightTapTimer);
    if (rightTapCount >= 3) { toggleReverseCheat(); rightTapCount = 0; }
    else rightTapTimer = setTimeout(function(){ rightTapCount=0; }, 800);
};
document.getElementById('cheat-right').addEventListener('touchstart', handleRightCheat, {passive:false});
document.getElementById('cheat-right').addEventListener('mousedown',  handleRightCheat);

// ============================================================
// 컨트롤러
// ============================================================
document.addEventListener('keydown', function(e) {
    if ([32,37,38,39,40].indexOf(e.keyCode) > -1) e.preventDefault();
    if      (e.keyCode===37) handleAction('left');
    else if (e.keyCode===39) handleAction('right');
    else if (e.keyCode===40) handleAction('down');
    else if (e.keyCode===38) handleAction('rotate');
    else if (e.keyCode===32) handleAction('hardDrop');
});

function setupBtn(id, action) {
    var btn = document.getElementById(id); if (!btn) return;
    btn.addEventListener('touchstart', function(e){e.preventDefault();handleAction(action);},{passive:false});
    btn.addEventListener('mousedown',  function(e){e.preventDefault();handleAction(action);});
}
setupBtn('btn-up','rotate'); setupBtn('btn-left','left');
setupBtn('btn-right','right'); setupBtn('btn-down','down');
setupBtn('btn-hardDrop','hardDrop');

document.getElementById('room-code-input').addEventListener('input', function(){
    this.value = this.value.toUpperCase();
});

// ============================================================
// 게임 시작
// ============================================================
function startGameUI() {
    initCanvases(isMultiplayer);

    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('game-wrapper').style.display = 'flex';
    document.getElementById('mobile-controls').style.display = 'flex';
    document.getElementById('status-bar').innerText = isMultiplayer ? '대결 시작!' : '싱글플레이';

    board=createMatrix(COLS,ROWS); opponentBoard=createMatrix(COLS,ROWS);
    score=0; linesCleared=0; dropInterval=1000; pendingGarbage=0;
    isIBlockCheat=false; isControlReversed=false; isOpponentReversed=false;
    updateScore();

    isGameOver=false; lastTime=0; nextPiece=null;
    playerReset();
    cancelAnimationFrame(animationId);
    update();
    clearInterval(syncIntervalId);
    if (isMultiplayer) syncIntervalId = setInterval(syncBoard, 1500);
}

// ============================================================
// URL 자동 입장
// ============================================================
window.addEventListener('load', function() {
    var code = getRoomCodeFromURL();
    if (code && code.length === 4) {
        document.getElementById('room-code-input').value = code;
        showToast('방에 자동 입장합니다!');
        setTimeout(joinMultiRoom, 1000);
    }
});
</script>
